# Обоснованные находки iec_checker (tools/check/run_iec_checker.py).
# Обоснованная находка попадает в отчёт со статусом allowed и не роняет проверку.
# Подробный разбор каждой записи — docs/STATIC_ANALYSIS.md; при изменении кода держите их согласованными.
#
# Ключи записи [[allow]]:
#   id     — идентификатор правила iec_checker (шаблон fnmatch), например "PLCOPEN-CP3";
#   file   — шаблон fnmatch пути исходника (src/POUs/...) или имени собранного файла (FB_X.st);
#            '*' захватывает и '/';
#   match  — необязательно: регулярное выражение по тексту сообщения;
#   reason — обязательно: почему находка допустима.
# ParserError и LexingError обосновать нельзя: их исправляют в коде или в понижении iec-checker.
#
# Тест tools/tests/test_run_iec_checker.py::test_integration_repository_sources требует, чтобы при
# прогоне с --tests использовалась каждая запись. Записи семейства ФБ — в его разделе; новое
# семейство добавляет свой раздел в конец файла.

# =====================================================================================================
# Общие (все семейства)
# =====================================================================================================

[[allow]]
id = "PLCOPEN-CP3"
file = "src/*"
reason = "Переменная без явного начального значения получает значение по умолчанию своего типа (МЭК 61131-3, как в CODESYS); вариант сборки iec-checker убирает неконстантные начальные значения"

[[allow]]
id = "PLCOPEN-CP3"
file = "tests/*"
reason = "Как для src/: значения по умолчанию типов; результаты тестов присваиваются до чтения"

[[allow]]
id = "PLCOPEN-CP9"
file = "tests/*"
reason = "Наборы тестов — последовательные вызовы без ветвлений (классическая сложность — 1); завышенный подсчёт iec_checker 0.4, метрика для тестов не показательна"

[[allow]]
id = "UnusedVariable"
file = "src/*"
match = "variable: (ST|FB|ITF)[A-Z0-9_]*$"
reason = "Ложное срабатывание iec_checker 0.4: обращение к полям структуры (stCfg.x), вызов экземпляра ФБ и его методов (fbDelay(...), fbSysTime.Now()) он не считает использованием. Префиксы st, fb, itf — правило имён CONTRIBUTING.md (префикс объединения u не включён: в верхнем регистре сообщения его не отличить от ui/udi)"

[[allow]]
id = "UnusedVariable"
file = "tests/*"
match = "variable: (ST|FB|ITF)[A-Z0-9_]*$"
reason = "Как для src/: экземпляры ФБ под тестом и структуры используются через вызовы, поля и SIZEOF"

[[allow]]
id = "UnusedVariable"
file = "*"
match = "variable: (UBITS|UBAD)$"
reason = "Ложное срабатывание iec_checker 0.4: объединения используются только через поля (uBits.rValue / uBits.dwValue — U_RealBits, uBad.iValue / uBad.eMode — тестовое U_TestEnumInt)"

[[allow]]
id = "PLCOPEN-L17"
file = "src/*"
reason = "PLCopen L17 (у каждого IF ветвь ELSE) — правило стиля. Пустую ветвь ELSE iec_checker 0.4 не разбирает (ParserError), заглушка x := x; ухудшает чтение; там, где ELSE нет, состояние в этом вызове сознательно не меняется (docs/STATIC_ANALYSIS.md)"

[[allow]]
id = "PLCOPEN-L17"
file = "tests/*"
reason = "Как для src/: ветви без действия в тестовом устройстве и тестах не записываются (пустую ветвь iec_checker 0.4 не разбирает)"

